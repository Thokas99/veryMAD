<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">veryMAD R package logo</title>
  <desc id="desc">An angry face built from a boxplot, median line, and outliers inside a hexagonal badge.</desc>

  <!-- Transparent outside the badge -->
  <path d="M512 38 914 270 914 754 512 986 110 754 110 270Z"
        fill="#FFF9F0" stroke="#2B2227" stroke-width="34" stroke-linejoin="round"/>
  <path d="M512 72 883 286 883 738 512 952 141 738 141 286Z"
        fill="none" stroke="#E24A3B" stroke-width="10" stroke-linejoin="round"/>

  <!-- Statistical outliers -->
  <g fill="#E24A3B">
    <circle cx="512" cy="134" r="10"/>
    <circle cx="512" cy="171" r="13"/>
    <circle cx="512" cy="216" r="16"/>
    <circle cx="512" cy="668" r="14"/>
    <circle cx="512" cy="705" r="10"/>
    <circle cx="512" cy="736" r="7"/>
  </g>

  <!-- Angry eyebrows -->
  <g fill="#8F1022">
    <path d="M248 270 435 358 408 414 226 329Z"/>
    <path d="M776 270 589 358 616 414 798 329Z"/>
  </g>

  <!-- Eyes -->
  <path d="M307 377c45 4 78 27 91 66-16 30-42 47-76 47-38 0-66-26-66-63 0-20 18-39 51-50Z"
        fill="#2B2227"/>
  <path d="M717 377c-45 4-78 27-91 66 16 30 42 47 76 47 38 0 66-26 66-63 0-20-18-39-51-50Z"
        fill="#2B2227"/>

  <!-- Central boxplot -->
  <g stroke="#2B2227" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 250V371M472 250h80M512 542v74M478 616h68" fill="none"/>
    <rect x="456" y="371" width="112" height="171" rx="4" fill="#F06452"/>
    <path d="M456 456h112" fill="none" stroke="#8F1022"/>
  </g>

  <!-- Deep frown -->
  <path d="M292 653Q512 493 732 653" fill="none" stroke="#8F1022"
        stroke-width="42" stroke-linecap="round"/>

  <!-- Package name -->
  <text x="512" y="840" text-anchor="middle"
        font-family="Inter, Helvetica Neue, Arial, sans-serif"
        font-size="94" font-weight="800" letter-spacing="-4">
    <tspan fill="#2B2227">very</tspan><tspan fill="#8F1022">MAD</tspan>
  </text>
</svg>
